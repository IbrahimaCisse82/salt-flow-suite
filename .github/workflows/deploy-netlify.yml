name: CI: Minimal test for Actions

on:
  push:
    branches: [ "main" ]

jobs:
  minimal_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print basic info
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"

      - name: Print secrets presence
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then echo "NETLIFY_AUTH_TOKEN=MISSING"; else echo "NETLIFY_AUTH_TOKEN=SET"; fi
          if [ -z "$NETLIFY_SITE_ID" ]; then echo "NETLIFY_SITE_ID=MISSING"; else echo "NETLIFY_SITE_ID=SET"; fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Success
        run: echo "minimal test OK"
