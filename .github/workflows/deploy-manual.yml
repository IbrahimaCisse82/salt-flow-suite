name: Manual Netlify Deploy

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Check Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          echo "NETLIFY_AUTH_TOKEN=${NETLIFY_AUTH_TOKEN:+SET}"
          echo "NETLIFY_SITE_ID=${NETLIFY_SITE_ID:+SET}"

      - name: Deploy to Netlify (official)
        uses: netlify/actions/cli@v4
        with:
          args: deploy --prod --dir=dist --site ${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
