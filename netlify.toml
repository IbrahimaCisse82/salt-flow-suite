[build]
  publish = "dist"
  command = "npm run build"

[context.production.environment]
  NODE_ENV = "production"

[headers]
  [[headers]]
  for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
